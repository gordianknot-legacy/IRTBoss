[tool.ruff]
# Pinned explicitly rather than left on ruff's defaults: CI runs `ruff check`
# with whatever version pip resolves that day, and an unpinned rule set means a
# ruff release can fail a build that touched nothing.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplification
    "RUF",    # ruff-specific
    "ISC",    # implicit string concatenation
    "NPY",    # numpy-specific
]
ignore = [
    # `= File(...)` / `= Depends(...)` in a signature default is the FastAPI
    # calling convention, not the mutable-default bug B008 exists to catch.
    "B008",
    # Long lines are reported by E501 in prose-heavy docstrings, which this
    # codebase uses deliberately to record why a statistic is computed the way
    # it is. The formatter keeps code lines in bounds.
    "E501",
    # `class X(str, Enum)` rather than `StrEnum`. Deliberate: these enums are
    # persisted in DB columns and serialised into JSON payloads, and the two
    # bases differ in what `str(X.MEMBER)` returns. Switching them is a data
    # format change, not a lint fix.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests unpack tuples for readability even when only one element is asserted on,
# and use `assert` on private helpers by design.
"tests/**" = ["RUF059", "RUF007"]
