# Fly.io deployment for the backend.
#
# Two processes from one image: the API and the RQ worker. They are separate
# `processes` entries rather than separate apps so that a deploy moves both at
# once — a worker running older estimation code than the API would produce
# results the API cannot describe, and the engine version stamped on every run
# would then be wrong.
#
# Secrets are NOT set here. `fly secrets set IRTBOSS_SECRET_KEY=...` and the
# database and Redis URLs likewise; anything in this file is committed.

app = "irtboss"
primary_region = "lhr"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  IRTBOSS_ENVIRONMENT = "production"
  IRTBOSS_UPLOAD_DIR = "/data/uploads"

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m app.workers.main"

# Migrations run before the new version takes traffic. Without this the first
# request after a schema change hits a database the code does not match.
[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["api"]
  # The API holds no session state — tokens are signed, not stored — so it is
  # safe to stop idle machines. The worker is not auto-stopped: a queued job
  # would sit undequeued until something else woke the machine.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/health"

# Uploaded CSVs. A single volume attached to one machine is the honest limit of
# this configuration: it works because the API and worker processes are
# scheduled together in one region, and it stops working the moment either
# scales past one machine. Object storage is the fix, and it is not yet built —
# see docs/v2/DEPLOYMENT.md.
[[mounts]]
  source = "irtboss_data"
  destination = "/data"

[[vm]]
  # Estimation is CPU-bound and holds the full response matrix plus a quadrature
  # grid per model in memory. 1 GB is a starting point, not a measured figure.
  size = "shared-cpu-2x"
  memory = "1gb"
